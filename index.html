function types(){return `<div class="grid3"><div class="info-card"><span class="badge">Aa · TEXT</span><h3>Words and names</h3><p>Linh or Blue</p></div><div class="info-card green"><span class="badge">12 · NUMBER</span><h3>Numeric values</h3><p>9 or 10</p></div><div class="info-card gold"><span class="badge">📅 DATE</span><h3>Calendar dates</h3><p>09/11/2026</p></div></div><h3 class="subheading">Classify these six entries</h3><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Cell value</th><th>Choose data type</th>${S.typeChecked?'<th>Check</th>':''}</tr></thead><tbody>${TYPE_ITEMS.map((item,i)=>`<tr><td><strong>${h(item.text)}</strong></td><td><select aria-label="Type for ${h(item.text)}" data-field="type" data-index="${i}"><option value="">Choose…</option>${['Text','Number','Date'].map(t=>`<option value="${t}" ${S.typeChoices[i]===t?'selected':''}>${t}</option>`).join('')}</select></td>${S.typeChecked?`<td>${S.typeChoices[i]===item.type?'<span class="result-pill">✓ Correct</span>':'<span class="result-pill bad">Review</span>'}</td>`:''}</tr>`).join('')}</tbody></table></div><button class="btn teal" data-action="check-types">Check my six answers</button>${S.typeChecked?feedback(`You scored ${scoreTypes()} / 6.`,`Remember: a name is text, an age is a number and a survey date is a date. You may change your answers and check again.`):''}`}
function validation(){const rules=[['all','Accept anything'],['text','Accept text only'],['ages','Accept whole numbers from 6 to 12'],['dates','Accept dates only']];const tests=[['9','Accept'],['banana','Reject'],['1000','Reject']];return `<div class="scene"><div class="kicker">Data Validation = A Gatekeeper</div><div class="compare"><div><small>1 · Enter</small><strong class="big">Age = 9</strong></div><span class="arrow">→</span><div><small>2 · Check a rule</small><strong class="big">6–12</strong></div></div><p><b>3 · Accept or warn:</b> A validation rule helps prevent mistakes, but it cannot guarantee that every answer is true.</p></div><h3 class="subheading">A. Choose the best rule for Age</h3><div class="option-grid">${rules.map(r=>choice('validationRule',r[0],r[1],S.validationRule===r[0])).join('')}</div><h3 class="subheading">B. Predict what the rule should do</h3><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Someone types</th><th>Accept or reject?</th></tr></thead><tbody>${tests.map((t,i)=>`<tr><td><b>${h(t[0])}</b></td><td><select data-field="prediction" data-index="${i}" aria-label="Result for ${h(t[0])}"><option value="">Choose…</option><option value="Accept" ${S.predictions[i]==='Accept'?'selected':''}>Accept ✅</option><option value="Reject" ${S.predictions[i]==='Reject'?'selected':''}>Reject ❌</option></select></td></tr>`).join('')}</tbody></table></div><button class="btn teal" data-action="check-validation">Check the gatekeeper</button>${S.validationChecked?feedback(`You scored ${scoreValidation()} / 4.`,`The correct Age rule is whole numbers from 6 to 12. Accept 9, reject “banana” and reject 1000.`):''}`}

function criterion(){return `<div class="info-card violet"><div class="kicker">Criterion = one matching rule</div><h3 style="margin-bottom:5px">Favorite Color = Blue</h3><p style="margin:0">Select every student whose row matches this rule.</p></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Select</th><th>Student</th><th>Favorite Color</th><th>Age</th></tr></thead><tbody>${EXAMPLE.map((r,i)=>`<tr class="${S.criteria[i]?'matched':''}"><td><label class="choice" style="display:inline-flex;padding:7px"><input type="checkbox" name="criterion" data-index="${i}" ${S.criteria[i]?'checked':''} aria-label="Select ${h(r.name)}"><span class="screen-reader">Select ${h(r.name)}</span></label></td><td><b>${h(r.name)}</b></td><td>${h(r.color)}</td><td>${r.age}</td></tr>`).join('')}</tbody></table></div><button class="btn teal" data-action="check-criterion">Check matching records</button>${S.criterionChecked?feedback(`You scored ${scoreCriterion()} / 4.`,`The matching students are <b>Linh and An</b>. A filter would show those two rows and hide the others, not delete them.`):''}`}

function ruleLab(){const correct=isRuleCorrect();const badRows=S.rows.filter(r=>!isValidAge(r.age));return `<div class="info-card blue"><div class="kicker">Excel simulation</div><h3>Apply Data Validation to Age cells C2:C11</h3><p style="margin-bottom:0">Choose the rule settings below, just as you would in Excel.</p></div><div class="rule-box" style="margin-top:16px"><div class="toolbar">▦ Data tab <strong>Data Validation</strong> <span>Settings</span></div><div class="grid2"><div class="field"><label for="ruleAllow">Allow</label><select id="ruleAllow" data-field="rule" data-key="allow"><option value="">Choose…</option>${[['any','Any value'],['whole','Whole number'],['text','Text only'],['date','Date']].map(o=>`<option value="${o[0]}" ${S.rule.allow===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div class="field"><label for="ruleCompare">Data</label><select id="ruleCompare" data-field="rule" data-key="comparison"><option value="">Choose…</option>${[['between','between'],['greater','greater than'],['equal','equal to']].map(o=>`<option value="${o[0]}" ${S.rule.comparison===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div class="field"><label for="ruleMin">Minimum</label><input id="ruleMin" data-field="rule" data-key="min" inputmode="numeric" placeholder="Minimum" value="${h(S.rule.min)}"></div><div class="field"><label for="ruleMax">Maximum</label><input id="ruleMax" data-field="rule" data-key="max" inputmode="numeric" placeholder="Maximum" value="${h(S.rule.max)}"></div></div><button class="btn teal" data-action="check-rule">Apply and test rule</button></div>${S.ruleChecked?`<div class="feedback ${correct?'':'bad'}"><strong>${correct?'✓ Rule set correctly':'Your rule was tested'}</strong>${correct?'Whole number · between · 6 and 12.':'The recommended settings are Whole number · between · Minimum 6 · Maximum 12.'}<div style="margin-top:10px">${badRows.length?`${badRows.length} record(s) currently have an invalid age under the correct 6–12 rule. You can return to your survey table to edit them.`:'All your survey age entries are valid whole numbers between 6 and 12.'}</div></div>`:''}<p class="hint">A cell format only changes appearance. <b>Data Validation</b> checks the value entered. A rule helps prevent mistakes, but it cannot verify that a student's claimed age is true.</p>`}
function filterLab(){let filtered=filterRows();let applied=S.filter.applied;let colors=['Blue','Red','Green','Yellow'];return `<div class="info-card green"><div class="kicker">One criterion at a time</div><h3>Find students who chose Blue</h3><p>Select the correct field and keyword, apply the filter, then count the results.</p></div><div class="rule-box" style="margin-top:16px"><div class="toolbar">▦ Data tab <strong>Filter ▾</strong> <span>Show matching rows</span></div><div class="grid2"><div class="field"><label for="filterField">Field (column)</label><select id="filterField" data-field="filter" data-key="field">${['Student','Favorite Color','Age','Survey Date'].map(x=>`<option value="${x}" ${S.filter.field===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="filterValue">Keyword / value</label><select id="filterValue" data-field="filter" data-key="value">${colors.map(c=>`<option value="${c}" ${S.filter.value===c?'selected':''}>${c}</option>`).join('')}</select></div></div><button class="btn light" data-action="apply-filter">Apply Filter</button>${applied?`<button class="btn ghost" data-action="clear-filter" style="margin-left:8px">Clear Filter</button>`:''}</div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Student</th><th>Favorite Color</th><th>Age</th><th>Survey Date</th></tr></thead><tbody>${(applied?filtered:S.rows).map(r=>`<tr class="${applied?'matched':''}"><td>${h(r.name)}</td><td>${h(r.color)}</td><td>${h(r.age)}</td><td>${h(r.date)}</td></tr>`).join('')||'<tr><td colspan="4">No records match this selection. Try another filter.</td></tr>'}</tbody></table></div>${applied?`<div class="pill-row">${tag(`${filtered.length} row(s) shown`)}${tag(`${S.rows.length-filtered.length} row(s) hidden, not deleted`)}</div><div class="field" style="max-width:360px"><label for="filterCount">How many students chose Blue?</label><input id="filterCount" inputmode="numeric" data-field="filter" data-key="count" value= let summary=[Row(1,['LESSON SUMMARY'],'title',2,32),Row(2,['Completion and objective scores are not a final course grade.'],'accent',2),Row(3,['Measure','Result'],'header')];let sumArr=[['Student',S.name],['Class',S.klass],['Required tasks completed',countComplete()],['Total required tasks',REQUIRED.length],['Completion status',countComplete()===REQUIRED.length?'Completed':'Incomplete'],['Auto-checked activity points',scoreObjective()-scoreQuiz()],['Auto-checked activity maximum',18],['Quiz score',scoreQuiz()],['Quiz maximum',10],['Total objective score',scoreObjective()],['Total objective maximum',28],['Overall objective percentage',Math.round((scoreObjective()/28)*100)+'%'],['Items requiring teacher review','Warm-up, survey table, two exit-ticket answers'],['Homework','Separate Canvas upload; not auto-marked'],['Optional challenge',S.challenge?'Tried':'Not attempted'],['Completion timestamp',stamp],['Canvas submission','Student must upload .xlsx separately']];sumArr.forEach((x,i)=>summary.push(Row(i+4,x)));sh.push({name:'Summary',rows:summary,widths:[45,85]});return sh}
function packWorkbook(sheets){const names=sheets.map(x=>x.name);const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>${names.map((n,i)=>`<sheet name="${xml(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`;const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${names.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${names.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${names.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="4"><font><sz val="11"/><name val="Aptos"/><color rgb="FF243951"/></font><font><b/><sz val="17"/><name val="Aptos Display"/><color rgb="FFFFFFFF"/></font><font><b/><sz val="11"/><name val="Aptos"/><color rgb="FFFFFFFF"/></font><font><b/><sz val="11"/><name val="Aptos"/><color rgb="FF176C79"/></font></fonts><fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF183F59"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1B697E"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEAF5F7"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf><xf numFmtId="0" fontId="2" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="3" fillId="4" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="3" fillId="4" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
return zipFiles([{path:'[Content_Types].xml',text:ct},{path:'_rels/.rels',text:rootRels},{path:'xl/workbook.xml',text:wb},{path:'xl/_rels/workbook.xml.rels',text:rels},{path:'xl/styles.xml',text:styles},...sheets.map((s,i)=>({path:`xl/worksheets/sheet${i+1}.xml`,text:sheetXml(s.rows,s.widths)}))])}
function filename(){const name=S.name.trim().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9 _-]/g,'').trim().replace(/\s+/g,'_').slice(0,46)||'Student';return `G4_${S.klass}_${name}_Week13_Results.xlsx`}
function downloadExcel(){let blob=packWorkbook(dataWorkbook()),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename();a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);S.downloaded=true;const notice=document.getElementById('downloadNotice');if(notice){notice.className='feedback';notice.textContent=`Your Excel file (${filename()}) has been prepared for download. Upload it to Canvas to submit your work.`}}
render();
})();
